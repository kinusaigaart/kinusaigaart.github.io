<style>
/* =========================================
   COLOUR PALETTE (Royal Indigo & Champagne Gold)
========================================= */
:root {
    --bg-page: #F8FAFC;
    --bg-surface: #FFFFFF;
    --primary: #1E3A5F;
    --primary-dark: #12253D;
    --accent-gold: #C29A38;
    --accent-gold-light: #FBF6EA;
    --text-primary: #1D2530;
    --text-secondary: #586575;
    --border-soft: #E2E8F0;
    --white: #FFFFFF;
    --shadow-sm: 0 4px 16px rgba(30, 58, 95, 0.05);
    --shadow-md: 0 10px 30px rgba(30, 58, 95, 0.08);
    --shadow-lg: 0 16px 40px rgba(30, 58, 95, 0.16);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .footer-brand {
    font-family: 'Playfair Display', Georgia, serif;
}

a {
    text-decoration: none;
    color: inherit;
}

section {
    padding: 85px 7%;
}

/* =========================================
   HEADER / NAVBAR
========================================= */
header {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-soft);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar {
    max-width: 1240px;
    min-height: 80px;
    margin: auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand-logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-emblem {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border: 2px solid var(--accent-gold);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-gold);
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(30, 58, 95, 0.15);
}

.brand-text-block {
    display: flex;
    flex-direction: column;
}

.brand-title {
    font-family: 'Cinzel', serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--primary);
    line-height: 1.1;
}

.brand-subtitle {
    font-size: 10.5px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--accent-gold);
    font-weight: 600;
    margin-top: 2px;
}

nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: var(--text-primary);
    font-size: 14.5px;
    font-weight: 600;
    transition: color 0.25s ease;
}

nav a:hover {
    color: var(--accent-gold);
}

/* =========================================
   HERO / HOME
========================================= */
#home {
    min-height: 680px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 75px 5%;
    background: 
        radial-gradient(circle at 10% 20%, rgba(194, 154, 56, 0.10), transparent 30%),
        radial-gradient(circle at 90% 25%, rgba(30, 58, 95, 0.08), transparent 30%),
        var(--bg-page);
}

.hero-wrapper {
    max-width: 1240px;
    width: 100%;
    margin: auto;
    display: grid;
    grid-template-columns: 250px 1fr 250px;
    align-items: center;
    gap: 32px;
}

.hero-center {
    text-align: center;
}

.hero-pill {
    display: inline-block;
    padding: 6px 18px;
    background: var(--accent-gold-light);
    border: 1px solid rgba(194, 154, 56, 0.35);
    border-radius: 30px;
    color: #8C6A1B;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 22px;
}

.main-brand-title {
    font-family: 'Cinzel', serif;
    font-size: 50px;
    letter-spacing: 6px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
}

.brand-tagline {
    color: var(--accent-gold);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.hero-center h1 {
    font-size: 34px;
    color: var(--primary-dark);
    margin-bottom: 14px;
    font-weight: 600;
    letter-spacing: -0.3px;
}

.hero-center h1::after {
    content: "";
    display: block;
    width: 65px;
    height: 3px;
    background: var(--accent-gold);
    margin: 14px auto 0;
    border-radius: 4px;
}

.hero-center p {
    max-width: 580px;
    margin: 20px auto;
    font-size: 16.5px;
    color: var(--text-secondary);
    line-height: 1.8;
}

.buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    padding: 13px 32px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.3s ease;
}

.btn-primary {
    background: var(--primary);
    color: var(--white);
    border: 2px solid var(--primary);
    box-shadow: 0 6px 18px rgba(30, 58, 95, 0.22);
}

.btn-primary:hover {
    background: var(--primary-dark);
    border-color: var(--primary-dark);
    transform: translateY(-2px);
}

.btn-secondary {
    background: var(--white);
    color: var(--primary);
    border: 2px solid var(--border-soft);
}

.btn-secondary:hover {
    border-color: var(--accent-gold);
    color: var(--accent-gold);
    transform: translateY(-2px);
}

/* Side Cards */
.hero-side {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.side-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    padding: 22px 18px;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
    text-align: left;
}

.side-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent-gold);
    box-shadow: var(--shadow-md);
}

.side-card-icon {
    font-size: 26px;
    margin-bottom: 10px;
    display: inline-block;
}

.side-card h4 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--primary);
    margin-bottom: 6px;
}

.side-card p {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.55;
}

/* =========================================
   SECTION TITLES
========================================= */
.section-title {
    text-align: center;
    margin-bottom: 50px;
}

.section-title h2 {
    font-size: 36px;
    color: var(--primary);
    margin-bottom: 8px;
}

.section-title p {
    color: var(--text-secondary);
    font-size: 16.5px;
}

.section-title::after {
    content: "";
    display: block;
    width: 55px;
    height: 3px;
    background: var(--accent-gold);
    margin: 14px auto 0;
    border-radius: 4px;
}

/* =========================================
   GALLERY (STORE / SALE READY)
========================================= */
#gallery {
    background: #F1F5F9;
}

.gallery-grid {
    max-width: 1150px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
}

.gallery-card {
    background: var(--bg-surface);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border-soft);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
}

.gallery-card:hover {
    transform: translateY(-6px);
    border-color: var(--accent-gold);
    box-shadow: var(--shadow-md);
}

.gallery-image-container {
    height: 250px;
    width: 100%;
    background: #EAEFF5;
    position: relative;
    overflow: hidden;
}

.gallery-image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
}

.gallery-card:hover .gallery-image-container img {
    transform: scale(1.05);
}

.art-tag {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(30, 58, 95, 0.9);
    color: var(--accent-gold);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
}

.gallery-card-content {
    padding: 22px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.gallery-card h3 {
    color: var(--primary);
    margin-bottom: 6px;
    font-size: 20px;
}

.art-meta {
    font-size: 13px;
    color: #8C6A1B;
    font-weight: 600;
    margin-bottom: 8px;
}

.gallery-card p {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.55;
    margin-bottom: 18px;
    flex-grow: 1;
}

.card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--border-soft);
}

.art-price {
    font-family: 'Playfair Display', serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--primary);
}

.btn-buy {
    background: #25D366;
    color: white;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 24px;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.btn-buy:hover {
    background: #1DA851;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
}

/* =========================================
   TESTIMONIALS SECTION
========================================= */
#testimonials {
    background: var(--bg-page);
}

.testimonials-grid {
    max-width: 1150px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
}

.testimonial-card {
    background: var(--bg-surface);
    border-radius: 20px;
    padding: 34px 28px;
    border: 1px solid var(--border-soft);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.3s ease;
}

.testimonial-card:hover {
    transform: translateY(-6px);
    border-color: var(--accent-gold);
    box-shadow: var(--shadow-md);
}

.stars {
    color: #E5A93B;
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 14px;
}

.testimonial-text {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 22px;
    font-style: italic;
}

.client-info {
    display: flex;
    align-items: center;
    gap: 14px;
    border-top: 1px solid var(--border-soft);
    padding-top: 16px;
}

.client-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent-gold));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 17px;
    flex-shrink: 0;
}

.client-details h4 {
    font-size: 16px;
    color: var(--primary);
    margin-bottom: 2px;
}

.client-details span {
    font-size: 12.5px;
    color: #8C6A1B;
    font-weight: 600;
}

.share-review-box {
    text-align: center;
    margin-top: 45px;
}

.btn-review {
    display: inline-block;
    padding: 12px 28px;
    background: var(--bg-surface);
    color: var(--primary);
    border: 1.5px solid var(--accent-gold);
    border-radius: 30px;
    font-weight: 600;
    font-size: 14.5px;
    transition: all 0.3s ease;
}

.btn-review:hover {
    background: var(--accent-gold);
    color: white;
    transform: translateY(-2px);
}

/* =========================================
   HOW TO ORDER & PAYMENT DETAILS
========================================= */
#payment {
    background: #F1F5F9;
}

.payment-container {
    max-width: 1050px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: stretch;
}

.order-steps {
    background: var(--bg-surface);
    border: 1px solid var(--border-soft);
    border-radius: 20px;
    padding: 36px 30px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.order-steps h3 {
    color: var(--primary);
    font-size: 24px;
    margin-bottom: 22px;
}

.step-item {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
}

.step-item:last-child {
    margin-bottom: 0;
}

.step-num {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent-gold-light);
    color: #8C6A1B;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.step-text h4 {
    font-size: 16px;
    color: var(--primary);
    margin-bottom: 4px;
}

.step-text p {
    font-size: 14px;
    color: var(--text-secondary);
}

.payment-card {
    background: linear-gradient(135deg, #182C47 0%, #0F1E31 100%);
    border: 1px solid rgba(194, 154, 56, 0.3);
    border-radius: 22px;
    padding: 38px 30px;
    color: white;
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.payment-card h3 {
    color: var(--accent-gold);
    font-size: 24px;
    margin-bottom: 8px;
    text-align: center;
}

.payment-card p.subtitle {
    color: #D6E0EA;
    font-size: 14px;
    margin-bottom: 24px;
    text-align: center;
}

.upi-highlight-box {
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px dashed var(--accent-gold);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 22px;
}

.upi-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-gold);
    font-weight: 700;
    margin-bottom: 8px;
}

.upi-id-value {
    font-family: monospace;
    font-size: 20px;
    font-weight: 700;
    color: #FFFFFF;
    background: rgba(0, 0, 0, 0.25);
    padding: 8px 16px;
    border-radius: 8px;
    display: inline-block;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
}

.btn-copy-upi {
    display: inline-block;
    background: var(--accent-gold);
    color: #12253D;
    font-size: 12.5px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    border: none;
    transition: all 0.25s ease;
}

.btn-copy-upi:hover {
    background: #E5B445;
    transform: translateY(-2px);
}

.bank-details-box {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 14px;
    text-align: center;
}

.coming-soon-badge {
    display: inline-block;
    background: rgba(194, 154, 56, 0.2);
    color: var(--accent-gold);
    border: 1px solid var(--accent-gold);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* =========================================
   OUR STORY
========================================= */
#story {
    background: var(--bg-page);
}

.story-content {
    max-width: 820px;
    margin: auto;
    text-align: center;
    background: var(--bg-surface);
    padding: 44px 38px;
    border-radius: 20px;
    border: 1px solid var(--border-soft);
    box-shadow: var(--shadow-sm);
}

.story-content p {
    margin-bottom: 18px;
    font-size: 17px;
    color: var(--text-primary);
    line-height: 1.85;
}

.story-content p:last-child {
    margin-bottom: 0;
}

/* =========================================
   WHY US
========================================= */
#features {
    background: #F1F5F9;
}

.features-grid {
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
}

.feature-card {
    background: var(--bg-surface);
    padding: 38px 26px;
    text-align: center;
    border-radius: 18px;
    border: 1px solid var(--border-soft);
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
}

.feature-card:hover {
    transform: translateY(-6px);
    border-color: var(--accent-gold);
    box-shadow: var(--shadow-md);
}

.feature-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--accent-gold-light);
    color: var(--accent-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    border: 1px solid rgba(194, 154, 56, 0.35);
}

.feature-card h3 {
    color: var(--primary);
    margin-bottom: 10px;
    font-size: 20px;
}

.feature-card p {
    color: var(--text-secondary);
    font-size: 14.5px;
}

/* =========================================
   CUSTOM ORDERS
========================================= */
#custom {
    background: var(--bg-page);
}

.custom-box {
    max-width: 950px;
    margin: auto;
    padding: 60px 40px;
    text-align: center;
    background: linear-gradient(135deg, #182C47 0%, #0F1E31 100%);
    color: var(--white);
    border-radius: 22px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    border: 1px solid rgba(194, 154, 56, 0.25);
}

.custom-box h2 {
    font-size: 36px;
    margin-bottom: 16px;
    color: var(--accent-gold);
}

.custom-box p {
    max-width: 680px;
    margin: auto;
    color: #D6E0EA;
    font-size: 16.5px;
    line-height: 1.8;
}

.custom-button {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 34px;
    background: linear-gradient(135deg, #C29A38, #A37E22);
    color: #FFFFFF;
    border-radius: 30px;
    font-weight: 600;
    font-size: 15px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    transition: all 0.3s ease;
}

.custom-button:hover {
    background: linear-gradient(135deg, #D4AA44, #B88E28);
    transform: translateY(-2px);
}

/* =========================================
   CONTACT
========================================= */
#contact {
    background: #F1F5F9;
    text-align: center;
}

.contact-content {
    max-width: 650px;
    margin: auto;
}

.contact-content p {
    color: var(--text-secondary);
    font-size: 16.5px;
    margin-bottom: 22px;
}

.whatsapp-button {
    display: inline-block;
    padding: 13px 32px;
    background: #25D366;
    color: white;
    border-radius: 30px;
    font-weight: 600;
    font-size: 15px;
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.28);
    transition: all 0.3s ease;
}

.whatsapp-button:hover {
    background: #20BA5A;
    transform: translateY(-2px);
}

   FOOTER & VISITOR BADGE
========================================= */

    <div class="footer-brand">KINUSAIGA ART</div>
    <p>Handmade • Creative • Unique</p>

<!-- Copy UPI Script -->
<script>
function copyUPI() {
    const upi = document.getElementById("upiText").innerText;
    navigator.clipboard.writeText(upi).then(() => {
        const btn = document.querySelector(".btn-copy-upi");
        btn.innerText = "✓ Copied to Clipboard!";
        setTimeout(() => {
            btn.innerText = "📋 Copy UPI ID";
        }, 2500);
    });
}
</script>
